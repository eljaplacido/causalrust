version: 2

updates:
  # Cargo. Grouped so a routine week is one PR rather than fifteen — a stream of
  # individual bumps is how a security update gets lost among them.
  - package-ecosystem: cargo
    directory: /causalrust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  # Actions are pinned by tag, and a stale one is how CI silently stops testing
  # what it claims to. This repository shipped for months on an action reference
  # that did not resolve at all.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
