[package]
name = "cynepic-graph"
description = "Typed async workflow graphs with conditional edges, cycle detection, per-node timeouts, checkpoint/resume, and event hooks"
readme = "../../README.md"
keywords = ["workflow", "state-machine", "graph", "orchestration", "async"]
categories = ["asynchronous", "data-structures", "development-tools"]
documentation = "https://docs.rs/cynepic-graph"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
cynepic-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
