[package]
name = "cynepic-guardian"
description = "Policy guardrails for AI systems: Rego evaluation, circuit breaker, rate limiting, loop detection, HITL escalation, and an append-only audit trail"
readme = "../../README.md"
keywords = ["policy", "guardrails", "circuit-breaker", "rate-limiting", "audit"]
categories = ["development-tools", "asynchronous"]
documentation = "https://docs.rs/cynepic-guardian"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
cynepic-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
regorus = { workspace = true, optional = true }

[features]
default = ["rego"]
rego = ["dep:regorus"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
