[package]
name = "cynepic-bayes"
description = "Bayesian inference with exact conjugate posteriors, calibrated credible intervals, and MCMC samplers verified by simulation-based calibration"
readme = "../../README.md"
keywords = ["bayesian", "mcmc", "statistics", "conjugate-prior", "calibration"]
categories = ["science", "mathematics", "algorithms"]
documentation = "https://docs.rs/cynepic-bayes"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
# Document every feature. Without this, docs.rs builds default features only,
# and an optional surface — `guardian`'s Rego evaluator, for one — is absent
# from the published documentation with no indication it exists.
all-features = true

[dependencies]
cynepic-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
statrs = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_distr = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
# Calibration harness: credible-interval coverage and simulation-based
# calibration. Internal, publish = false, so it never reaches a consumer.
cynepic-testkit = { workspace = true }
rand_chacha = { workspace = true }

criterion = { workspace = true }

[[bench]]
name = "samplers"
harness = false

[lints]
workspace = true
