[package]
name = "cynepic-causal"
description = "Causal inference with validated estimators: DAG, d-separation, backdoor and front-door identification, OLS/IPW/2SLS estimation with measured interval coverage, and refutation"
readme = "../../README.md"
keywords = ["causal-inference", "statistics", "econometrics", "dag", "treatment-effect"]
categories = ["science", "mathematics", "algorithms"]
documentation = "https://docs.rs/cynepic-causal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
cynepic-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
petgraph = { workspace = true }
ndarray = { workspace = true }
# Refutation needs reproducible randomness (finding C8): ChaCha8 with the seed
# on the public API, replacing an unseedable hand-rolled LCG.
rand = { workspace = true }
rand_chacha = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
# Ground-truth simulation and the coverage harness. Internal, publish = false,
# so it never reaches a consumer of this crate.
cynepic-testkit = { workspace = true }

criterion = { workspace = true }

[[bench]]
name = "estimators"
harness = false

[lints]
workspace = true
