# macOS cannot link a `cdylib` with unresolved symbols, and a Python extension
# module has them by design: `_PyExc_ValueError` and friends are supplied by the
# interpreter at load time, not at link time.
#
# `-undefined dynamic_lookup` tells the macOS linker to defer them, which is what
# PyO3 documents and what maturin passes when it builds a wheel. Without it,
# `cargo build --workspace` fails on macOS only — Linux tolerates the dangling
# symbols and succeeds by accident, so the break looks platform-specific when it
# is really the same missing instruction everywhere.
#
# Scoped to the Apple targets. The only `cdylib` in this workspace is the PyO3
# binding, so nothing else is affected; on any other target these lines do not
# exist and a genuine undefined symbol still fails the build.
[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]
