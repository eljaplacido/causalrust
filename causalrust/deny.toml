# cargo-deny configuration for the cynepic-rs workspace.
#
# Run locally with:  cargo deny check all
# Installed via:     cargo install cargo-deny

[graph]
# Check the dependency graph for every platform we advertise support for,
# including the WASM target guarded in CI.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]
all-features = true

[advisories]
version = 2

# Security vulnerabilities always fail, at any depth.
#
# "Unmaintained" advisories only fail for crates this workspace depends on
# directly, where we can actually act. Applying them transitively means CI goes
# red for a crate five levels down that we cannot upgrade — e.g. RUSTSEC-2024-0436
# (`paste`, unmaintained, no safe upgrade) reaches us via
# statrs -> nalgebra -> simba -> paste. A gate nobody can clear gets muted, and
# then the real vulnerabilities get muted with it.
unmaintained = "workspace"

# Specific advisories waived. Every entry needs a reason and a review date.
ignore = []

[licenses]
version = 2
# Permissive licenses acceptable in the dependency tree. This list governs our
# DEPENDENCIES, not our own crates' terms.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
# The allow list is deliberately broader than the current dependency tree so a
# new permissively-licensed transitive dep does not break the build. Don't warn
# about entries that happen to be unused today.
unused-allowed-license = "allow"

# No exceptions needed: as of 2026-08-17 the workspace's own crates are
# Apache-2.0, which is already in the allow list above. The previous BUSL-1.1
# exception block was deleted with the relicence.

[bans]
# Duplicate versions of the same crate bloat build times and binary size.
# Warn rather than deny: transitive duplicates are often not ours to fix.
multiple-versions = "warn"
wildcards = "deny"
# Prefer the highest version when a duplicate is unavoidable.
highlight = "all"

deny = [
    # Unmaintained TLS stack; if an HTTP surface lands, use rustls.
    { name = "openssl", reason = "prefer rustls for portability and no system deps" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
